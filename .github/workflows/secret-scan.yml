# Secret-Scan bei jedem Push und Pull Request, über die ganze Git-Historie.
# Zweite Sperre neben dem lokalen pre-commit-Hook (der wird von Git nicht mitversioniert).
# Werkzeug: gitleaks als Container, feste Version; kein eigenes Geheimnis nötig.
# Ein Fund lässt den Job rot enden. Ein gepushter Schlüssel bleibt in der Historie:
# dann den Schlüssel beim Anbieter sofort tauschen, nicht nur die Datei ändern.

name: Secret-Scan

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository mit ganzer Historie holen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks über alle Commits
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source /repo --redact --verbose --exit-code 1
